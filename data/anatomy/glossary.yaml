joints:
- model_name: pro_sup_r
  canonical_name: forearm pronation-supination
  positive_direction: pronation
  positive_direction_evidence: 'derived: kinematic perturbation + muscle dL/dq sign at qpos0 (reports/P2); confirm
    over full range in P3'
  status: derived
  aliases:
  - pro_sup
  notes: 'kinematic: radial axis rotates negatively about the distal axis (pronation for a right forearm); muscle:
    PT and PQ drive +'
  kinematic_expected: pronation
  muscles_driving_positive:
  - PT_r
  - PQ_r
  muscles_driving_negative: []
  negative_direction: supination
- model_name: deviation_r
  canonical_name: wrist radial-ulnar deviation
  positive_direction: radial deviation
  positive_direction_evidence: 'derived: kinematic perturbation + muscle dL/dq sign at qpos0 (reports/P2); confirm
    over full range in P3'
  status: derived
  aliases:
  - deviation
  notes: 'kinematic: fingertip moves radially; muscle: ECRL drives +, ECU and FCU drive -. P3: SIGN INVERTED relative
    to the MoBL-ARMS source (reports/P3/wrist_convention_check.json, fingertip-direction cosine -0.99): in MoBL,
    + is ulnar, so its range -10..+25 deg means 10 deg radial / 25 deg ulnar. MyoHand kept the numbers, so it allows
    25 deg radial / 10 deg ulnar (gap T10). Wrist mechanism also differs (single joint vs two-row splines, gap T6).
    BioHand patch wrist_rom_v1 restores the source meaning: range -25..+10 deg (25 deg ulnar / 10 deg radial) in
    MyoHand''s sign convention.'
  kinematic_expected: radial
  muscles_driving_positive:
  - ECRL_r
  muscles_driving_negative:
  - ECU_r
  - FCU_r
  negative_direction: ulnar deviation
- model_name: flexion_r
  canonical_name: wrist flexion-extension
  positive_direction: flexion (palmar)
  positive_direction_evidence: 'derived: kinematic perturbation + muscle dL/dq sign at qpos0 (reports/P2); confirm
    over full range in P3'
  status: derived
  aliases:
  - flexion
  notes: 'kinematic: fingertip moves palmar; muscle: FCR, FCU, PL drive +, ECRB, ECU, EDC drive -. P3: direction
    matches MoBL-ARMS (cosine 0.9996); range narrowed from +/-70 deg (gap T5); BioHand patch wrist_rom_v1 restores
    +/-70 deg'
  kinematic_expected: palmar
  muscles_driving_positive:
  - FCR_r
  - FCU_r
  - PL_r
  muscles_driving_negative:
  - ECRB_r
  - ECU_r
  - EDC3_r
  negative_direction: extension (dorsal)
- model_name: cmc_flexion_r
  canonical_name: thumb carpometacarpal flexion-extension (MoBL axis)
  positive_direction: extension (MoBL convention)
  positive_direction_evidence: 'muscle only: OP and EPB signs (OP drives -, EPB drives +); hand-frame kinematic
    test not discriminative for the thumb'
  status: derived_muscle_only
  aliases:
  - cmc_flexion
  notes: oblique axis defined by MoBL/2nd-Hand; thumb CMC conventions vary - do not relabel without a source
  kinematic_expected: null
  muscles_driving_positive:
  - EPB_r
  muscles_driving_negative:
  - OP_r
  negative_direction: flexion (MoBL convention)
- model_name: cmc_abduction_r
  canonical_name: thumb carpometacarpal abduction-adduction (MoBL axis)
  positive_direction: abduction (MoBL convention)
  positive_direction_evidence: 'muscle only: APL drives +'
  status: derived_muscle_only
  aliases:
  - cmc_abduction
  kinematic_expected: null
  muscles_driving_positive:
  - APL_r
  muscles_driving_negative: []
  negative_direction: adduction (MoBL convention)
- model_name: mp_flexion_r
  canonical_name: thumb metacarpophalangeal flexion-extension
  positive_direction: extension
  positive_direction_evidence: 'muscle only: FPL drives -, EPL and EPB drive +'
  status: derived_muscle_only
  aliases:
  - mp_flexion
  notes: range -45..+40 deg = 45 deg flexion, 40 deg extension
  kinematic_expected: null
  muscles_driving_positive:
