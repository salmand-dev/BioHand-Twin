# BioHand Twin anatomical glossary - source of truth for canonical names.
# Hand-curated after initial generation; validated by tests/test_naming.py.
# Never add a structure the model does not contain, except under not_represented.
schema_version: 1
model:
  name: MyoHand fragment
  myosim_commit: 93b0ca8f4ec90c9899ee7f05fee561e9911da91b
status_values:
  verified: canonical name taken from the cited, retrieved source
  provisional: standard English anatomical term; citation to an anatomy reference pending
  derived: direction semantics computed from the model (kinematic and muscle evidence agree)
  derived_muscle_only: direction semantics from muscle moment-arm signs only
  unresolved: identity not settled by any retrieved source; UI must show an 'unverified' badge
  n/a: non-anatomical element
representation_values:
  simulated_segment: moves independently through its own joint(s)
  rigid_part_of:<body>: welded; moves only as part of the rigid segment rooted at <body>
  fixed_reference: anatomical, but fixed to the world in this variant
  scaffold_non_hand: proximal anatomy kept as fixed scaffold; outside BioHand scope
  non_anatomical: simulation helper with no anatomical meaning
  simulated_actuator: MuJoCo muscle actuator on its own tendon
  combined_actuator: one actuator standing for more than one anatomical structure
  not_represented: anatomical structure absent from the model
