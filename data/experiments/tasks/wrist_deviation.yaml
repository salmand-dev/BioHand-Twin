id: wrist_deviation
description: Radial deviation (ECRL, FCR) for 1 s, then ulnar deviation (ECU, FCU) for 1 s.
brace_joints: [pro_sup_r]   # forearm brace (apparatus); wrist free
initial_angles_rad: {}
duration_s: 2.0
phases:
  - {start_s: 0.0, end_s: 1.0, ramp_s: 0.2, activations: {radial_deviators: 0.5}}
  - {start_s: 1.0, end_s: 2.0, ramp_s: 0.2, activations: {ulnar_deviators: 0.5}}
metrics:
  - {kind: joint_max, name: deviation_max_phase1, joint: deviation_r, from_s: 0.0, to_s: 1.0}
  - {kind: joint_min, name: deviation_min_phase2, joint: deviation_r, from_s: 1.0, to_s: 2.0}
success:
  - {metric: deviation_max_phase1, op: ">=", value: 0.1}         # radial (+) in MyoHand sign
  - {metric: deviation_min_phase2, op: "<=", value: -0.1}        # ulnar (-)
